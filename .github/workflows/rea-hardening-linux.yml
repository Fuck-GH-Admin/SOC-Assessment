name: REA hardening experiment (Linux ELF)

on:
  push:
    branches:
      - experiment/rea-soc-hardening-20261123
  workflow_dispatch:

concurrency:
  group: soc-rea-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libsqlite3-dev \
            upx-ucl libssl-dev python3-cryptography \
            xvfb xauth

      - name: Validate hardening packaging helpers
        run: python3 -m unittest discover -s tooling/hardening -p 'test_*.py'

      - name: Install project Flutter version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Enable Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Build obfuscated release (includes analyze and all Flutter tests)
        run: |
          python3 tooling/hardening/build_protected.py \
            --platform linux \
            --packer upx \
            --native-core \
            --output "$RUNNER_TEMP/soc-hardening"

      - name: Verify native executable really is UPX-packed
        run: |
          upx -t "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield/soc_app"
          upx -l "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield/soc_app"

      - name: Check executable and AOT ELF types
        run: |
          file "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield/soc_app"
          file "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield/lib/libapp.so"
          readelf -h "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield/lib/libapp.so"

      - name: Smoke-launch Linux GUI under a virtual display
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=3s 12s \
            xvfb-run -a "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield/soc_app" \
            > "$RUNNER_TEMP/soc-shield-startup.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/soc-shield-startup.log"
          if [ "$status" -ne 124 ]; then
            echo "Expected the GUI to remain alive for 12 seconds; exit status=$status"
            exit 1
          fi
          echo "PASS: executable remained alive under Xvfb for 12 seconds"

      - name: Check packaged manifest
        run: |
          python3 tooling/hardening/build_protected.py \
            --platform linux \
            --verify-manifest "$RUNNER_TEMP/soc-hardening/public/soc-shield-linux-manifest.json" \
            --bundle "$RUNNER_TEMP/soc-hardening/bundles/linux/SOC-Shield"

      # Do not publish private-symbols: they can undo obfuscated stack traces.
      - name: Upload packaged binary and public SHA-256 metadata
        uses: actions/upload-artifact@v4
        with:
          name: soc-shield-linux-elf-obfuscated
          path: |
            ${{ runner.temp }}/soc-hardening/public/*.tar.gz
            ${{ runner.temp }}/soc-hardening/public/*.sha256
            ${{ runner.temp }}/soc-hardening/public/*-manifest.json
          if-no-files-found: error
          retention-days: 14

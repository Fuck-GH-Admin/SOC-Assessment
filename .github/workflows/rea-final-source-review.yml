name: Final review of SOC reconstructed functions
on:
  push:
    branches:
      - experiment/rea-final-source-review-20261123
permissions:
  actions: read
  contents: read
jobs:
  final-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified AOT business-function dossier artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dossier" "$RUNNER_TEMP/out"
          curl --fail --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Fuck-GH-Admin/SOC-Assessment/actions/artifacts/14819361192/zip" \
            -o "$RUNNER_TEMP/dossier.zip"
          echo "5766881d053c4bede64b510b5c0c477846856921825a5dff19d75d284f7bc3b7  $RUNNER_TEMP/dossier.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/dossier.zip" -d "$RUNNER_TEMP/dossier"

      - name: Read actual decompiler stdout and build code-level report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"dossier"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"out"
          froot=root/"functions"
          report=["# SOC AOT decompilation output review",""]
          files=sorted(froot.glob("*.stdout"))
          for p in files:
            data=p.read_text(errors="replace")
            report += [f"## {p.stem}","",f"Output bytes: {len(data.encode())}",""]
            if data.strip(): report.append(data[:20000])
            else: report.append("(empty stdout; inspect stderr and output directory)")
            err=froot/(p.stem+".stderr")
            if err.exists() and err.stat().st_size:
              report += ["","stderr:",err.read_text(errors="replace")[:3000]]
            report.append("")
          strings=root/"strings"
          report += ["# String-query outputs",""]
          for p in sorted(strings.glob("*.stdout")):
            data=p.read_text(errors="replace")
            if data.strip(): report += [f"## {p.stem}","",data[:5000],""]
          asset=root/"assets/asset-analysis.md"
          if asset.exists(): report += ["# Asset inventory","",asset.read_text(errors="replace")[:12000]]
          idx=froot/"file-index.tsv"
          if idx.exists(): report += ["# File index","",idx.read_text(errors="replace")[:12000]]
          text="\\n".join(report)+"\\n"
          (out/"code-level-report.md").write_text(text)
          metrics={"function_outputs":len(files),"nonempty_outputs":sum(bool(p.read_text(errors="replace").strip()) for p in files),"total_output_bytes":sum(p.stat().st_size for p in files),"string_query_outputs":len(list(strings.glob("*.stdout")))}
          (out/"metrics.json").write_text(json.dumps(metrics,indent=2)+"\\n")
          print(json.dumps(metrics,indent=2))
          print(text[:35000])
          PY

      - name: Publish code-level report and upload
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/out/code-level-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload code-level report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-soc-code-level-review-20261123
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

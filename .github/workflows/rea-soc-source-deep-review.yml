name: Deep review of recovered SOC Dart source
on:
  push:
    branches:
      - experiment/rea-artifact-deep-review-20261123
permissions:
  actions: read
  contents: read
jobs:
  review-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download verified reconstruction output from the full REA run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered" "$RUNNER_TEMP/target" "$RUNNER_TEMP/tools" "$RUNNER_TEMP/review"
          curl --fail --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Fuck-GH-Admin/SOC-Assessment/actions/artifacts/14817228456/zip" \
            -o "$RUNNER_TEMP/recovered.zip"
          echo "46e071f6f81d14773a5ae2a68feafd440be4b37e4c81c5af9792fb965ea0ea7b  $RUNNER_TEMP/recovered.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/recovered.zip" -d "$RUNNER_TEMP/recovered"
          test -s "$RUNNER_TEMP/recovered/aotopsy/reconstructed-app/app/app.dart"

      - name: Retrieve exact libapp.so and AOTopsy 1.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Fuck-GH-Admin/SOC-Assessment/actions/artifacts/14771559896/zip" \
            -o "$RUNNER_TEMP/target.zip"
          unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target/archive"
          inner="$(find "$RUNNER_TEMP/target/archive" -name soc-shield-linux-x64.tar.gz -print -quit)"
          tar -xzf "$inner" -C "$RUNNER_TEMP/target"
          LIBAPP="$(find "$RUNNER_TEMP/target" -name libapp.so -print -quit)"
          echo "3c42c61436618aeec58473c434c7f3908ea15a05b6c0267a13b56327d01d30c8  $LIBAPP" | sha256sum --check -
          echo "SOC_LIBAPP=$LIBAPP" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 \
            "https://github.com/BroNils/aotopsy/releases/download/v1.6.0/aotopsy_v1.6.0_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/tools/aotopsy.tar.gz"
          echo "a16d5c9f79f34a4cdff5565128f58d0d97d7b1de058b395358f77dfff817ba45  $RUNNER_TEMP/tools/aotopsy.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/tools/aotopsy"
          tar -xzf "$RUNNER_TEMP/tools/aotopsy.tar.gz" -C "$RUNNER_TEMP/tools/aotopsy"
          AOT="$(find "$RUNNER_TEMP/tools/aotopsy" -name aotopsy -type f -perm -111 -print -quit)"
          echo "AOTOPSY_BIN=$AOT" >> "$GITHUB_ENV"

      - name: Inspect recovered Dart source and extract application-oriented code windows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib,os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"recovered"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"review"
          app=root/"aotopsy/reconstructed-app/app/app.dart"
          src=app.read_text(errors="replace")
          terms=re.compile(r"carbonStorage|algorithmVersion|depthLabel|soil|soc|sample|mass|bd|计算参数|算法口径|施肥处理|侵蚀强度|当前土层|土壤容重|辅助观测|采样|样点|碳储量|碳密度",re.I)
          classes=list(re.finditer(r"(?m)^\s*(?:abstract\s+)?class\s+([A-Za-z_$][\w$]*)",src))
          decls=list(re.finditer(r"(?m)^\s*(?:static\s+)?(?:external\s+)?(?:[\w$<>?,. ]+)\s+([A-Za-z_$][\w$]*)\s*\(",src))
          metrics={
            "source_path":str(app.relative_to(root)),"bytes":len(src.encode()),"lines":src.count("\n")+1,
            "classes":len(classes),"method_like_declarations":len(decls),
            "unknown_markers":{x:len(re.findall(re.escape(x),src)) for x in ["<unknown>","dynamicCall","indirectCall","stub_","sub_","local_"]},
            "domain_keyword_counts":{k:len(re.findall(k,src,re.I)) for k in ["carbon","soil","soc","sample","storage","sqlite","depth","density","calculate","layer","organic","bulk","mass"]}
          }
          (out/"source-metrics.json").write_text(json.dumps(metrics,indent=2)+"\n")
          lines=src.splitlines(); snippets=[]; seen=set()
          for i,line in enumerate(lines):
            if terms.search(line):
              lo=max(0,i-10); hi=min(len(lines),i+24)
              block="\n".join(f"{n+1}: {lines[n]}" for n in range(lo,hi))
              if block not in seen: seen.add(block); snippets.append((i+1,block))
          report=["# Recovered Dart source review","",f"- File: {app.relative_to(root)}",f"- {metrics['lines']} lines / {metrics['bytes']} bytes",f"- {metrics['classes']} classes / {metrics['method_like_declarations']} method-like declarations","","## Class names",""]
          report += [f"- {m.group(1)} (line {src[:m.start()].count(chr(10))+1})" for m in classes]
          report += ["","## App-related source windows",""]
          report += [f"### Around line {n}\n\n    "+b.replace("\n","\n    ") for n,b in snippets[:120]]
          (out/"recovered-source-review.md").write_text("\n".join(report)+"\n")
          print(json.dumps(metrics,indent=2))
          print("CLASS_NAMES="+", ".join(m.group(1) for m in classes))
          print("DOMAIN_WINDOWS="+str(len(snippets)))
          print((out/"recovered-source-review.md").read_text()[:16000])
          PY

      - name: Map preserved Dart strings to functions and call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib,os,bisect
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"recovered/aotopsy/full-pipeline"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"review"
          def readj(name):
            p=root/name
            return [json.loads(x) for x in p.open(errors="replace") if x.strip()]
          funcs=readj("functions.jsonl"); refs=readj("string_refs.jsonl")
          terms=re.compile(r"carbonStorage|algorithmVersion|depthLabel|soil|SOC|Sample|sample|mass|\\bbd\\b|计算参数|算法口径|施肥处理|侵蚀强度|当前土层|土壤容重|辅助观测|采样|样点|碳储量|碳密度",re.I)
          starts=[]
          for f in funcs:
            try: starts.append((int(str(f.get("pc","0")),16),int(f.get("size",0)),f))
            except Exception: pass
          starts.sort(key=lambda x:x[0]); pcs=[x[0] for x in starts]
          selected=[]; candidates={}
          for r in refs:
            value=str(r.get("value",""))
            if not terms.search(value): continue
            rec=dict(r)
            try: pc=int(str(r.get("pc","0")),16)
            except Exception: pc=0
            i=bisect.bisect_right(pcs,pc)-1; owner=None
            if i>=0:
              s,sz,fn=starts[i]
              if sz<=0 or pc<s+sz: owner=fn
            rec["containing_function"]=owner; selected.append(rec)
            if owner: candidates[str(owner.get("pc"))]=owner
          (out/"domain-string-refs.json").write_text(json.dumps(selected,ensure_ascii=False,indent=2)+"\n")
          rows=sorted(candidates.values(),key=lambda x:int(str(x.get("pc","0")),16))
          with (out/"function-candidates.tsv").open("w") as f:
            for x in rows[:40]: f.write(f"{x.get('pc','')}\t{x.get('name','')}\t{x.get('size','')}\n")
          print("DOMAIN_STRING_REFS",len(selected))
          for r in selected[:150]:
            print("STRING",r.get("pc"),r.get("func"),str(r.get("value",""))[:500])
            if r.get("containing_function"): print("OWNER",json.dumps(r["containing_function"],ensure_ascii=False)[:800])
          print("FUNCTION_CANDIDATES",len(rows))
          print((out/"function-candidates.tsv").read_text())
          PY

      - name: Decompile AOT main candidates and functions referencing business strings
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/review/targeted"
          mkdir -p "$OUT"
          run_func() {
            local addr="$1" name="$2"
            set +e
            timeout 240 "$AOTOPSY_BIN" _debug decompile-native --lib "$SOC_LIBAPP" --func "$addr" --out "$OUT/$name" > "$OUT/$name.stdout" 2> "$OUT/$name.stderr"
            local rc=$?
            set -e
            echo "$rc" > "$OUT/$name.exit"
            echo "$name $addr exit=$rc"
          }
          run_func 0x7d969c main-a
          run_func 0x7da31c main-b
          if [ -f "$RUNNER_TEMP/review/function-candidates.tsv" ]; then
            n=0
            while IFS=$'\t' read -r addr name size; do
              [ -n "$addr" ] || continue
              n=$((n+1)); [ "$n" -le 25 ] || break
              safe="$(echo "$addr" | tr -cd '[:alnum:]x')"
              run_func "$addr" "candidate-$safe"
            done < "$RUNNER_TEMP/review/function-candidates.tsv"
          fi
          for needle in carbonStorage sqlite3_column_bytes algorithmVersion depthLabel fert erosion bd; do
            set +e
            timeout 120 "$AOTOPSY_BIN" _debug strings --lib "$SOC_LIBAPP" --find "$needle" --xref > "$OUT/xref-$needle.stdout" 2> "$OUT/xref-$needle.stderr"
            echo "$?" > "$OUT/xref-$needle.exit"
            set -e
          done
          true

      - name: Build deep review report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"review"
          report=["# SOC reconstructed-source deep review",""]
          p=root/"source-metrics.json"
          if p.exists():
            m=json.loads(p.read_text())
            report += [f"- Recovered Dart: {m['lines']} lines / {m['bytes']} bytes",f"- Classes: {m['classes']}",f"- Method-like declarations: {m['method_like_declarations']}","- Unknown markers: "+json.dumps(m["unknown_markers"],ensure_ascii=False),"- Domain token counts: "+json.dumps(m["domain_keyword_counts"],ensure_ascii=False)]
          q=root/"domain-string-refs.json"
          if q.exists():
            refs=json.loads(q.read_text())
            report += ["",f"- Domain-related string references: {len(refs)}",""]
            report += ["  - "+json.dumps(x,ensure_ascii=False)[:900] for x in refs[:80]]
          report += ["","## Decompiled function exit statuses",""]
          targeted=root/"targeted"
          if targeted.exists():
            for p in sorted(targeted.glob("*.exit")): report.append(f"- {p.stem}: {p.read_text().strip()}")
          (root/"deep-review-summary.md").write_text("\n".join(report)+"\n")
          print((root/"deep-review-summary.md").read_text()[:18000])
          PY
          cat "$RUNNER_TEMP/review/deep-review-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source reconstruction review and targeted decompilations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-soc-source-deep-review-20261123
          path: ${{ runner.temp }}/review/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

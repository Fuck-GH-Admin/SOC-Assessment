name: AOTopsy xref-led decompilation of SOC persistence and calculation paths
on:
  push:
    branches:
      - experiment/rea-aot-xref-led-decompile-20261123
permissions:
  actions: read
  contents: read
jobs:
  xref-decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Download and verify original SOC libapp and AOTopsy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target" "$RUNNER_TEMP/tools" "$RUNNER_TEMP/out"/{strings,functions,logs}
          curl --fail --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Fuck-GH-Admin/SOC-Assessment/actions/artifacts/14771559896/zip" -o "$RUNNER_TEMP/target.zip"
          echo "7b50a68e9f5fe388845a806419baf71e3ba5138bb3ad0a6da0d91fb6f12cc8c3  $RUNNER_TEMP/target.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target/archive"
          inner="$(find "$RUNNER_TEMP/target/archive" -name soc-shield-linux-x64.tar.gz -print -quit)"
          tar -xzf "$inner" -C "$RUNNER_TEMP/target"
          LIBAPP="$(find "$RUNNER_TEMP/target" -name libapp.so -print -quit)"
          echo "3c42c61436618aeec58473c434c7f3908ea15a05b6c0267a13b56327d01d30c8  $LIBAPP" | sha256sum --check -
          echo "SOC_LIBAPP=$LIBAPP" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 "https://github.com/BroNils/aotopsy/releases/download/v1.6.0/aotopsy_v1.6.0_linux_amd64.tar.gz" -o "$RUNNER_TEMP/tools/aotopsy.tar.gz"
          echo "a16d5c9f79f34a4cdff5565128f58d0d97d7b1de058b395358f77dfff817ba45  $RUNNER_TEMP/tools/aotopsy.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/tools/aotopsy"
          tar -xzf "$RUNNER_TEMP/tools/aotopsy.tar.gz" -C "$RUNNER_TEMP/tools/aotopsy"
          AOT="$(find "$RUNNER_TEMP/tools/aotopsy" -name aotopsy -type f -perm -111 -print -quit)"
          echo "AOTOPSY_BIN=$AOT" >> "$GITHUB_ENV"

      - name: Search exact string xrefs for storage, schema, validation and calculation functions
        shell: bash
        run: |
          set -uo pipefail
          while IFS= read -r needle; do
            [ -n "$needle" ] || continue
            safe="$(printf '%s' "$needle" | tr -cs '[:alnum:]' '-')"
            set +e
            timeout --signal=TERM --kill-after=20s 180 "$AOTOPSY_BIN" _debug strings --lib "$SOC_LIBAPP" --find "$needle" --xref > "$RUNNER_TEMP/out/strings/$safe.stdout" 2> "$RUNNER_TEMP/out/logs/xref-$safe.stderr"
            rc=$?
            set -e
            echo "$rc" > "$RUNNER_TEMP/out/logs/xref-$safe.exit"
            echo "xref $needle exit=$rc"
          done <<'EOF'
          sqlite3_column_bytes
          sqlite3_open
          sqlite3_prepare
          sqlite3_step
          sqlite3_finalize
          CREATE TABLE
          INSERT INTO
          UPDATE
          SELECT
          algorithmVersion
          cropBiomass
          soilLayers
          carbonStorage
          carbonDensity
          socValue
          litterCarbonInput
          strawCarbonRatio
          记录的 algorithmVersion 必须大于0
          记录的 algorithmVersion 必须为数字
          EOF

      - name: Extract every xref owner and decompile candidate functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re,collections
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"out"
          owners=collections.defaultdict(set)
          for p in (root/"strings").glob("*.stdout"):
            s=p.read_text(errors="replace")
            for addr in re.findall(r"used in:\s+\S+\s+@\s+(0x[0-9a-fA-F]+)",s):
              owners[addr.lower()].add(p.stem)
          for addr in ["0x824150","0x825900","0x817320"]:
            owners[addr].add("known-business-xref")
          with (root/"functions"/"xref-owners.tsv").open("w") as f:
            for addr,names in sorted(owners.items(),key=lambda x:int(x[0],16)):
              f.write(addr+"\t"+",".join(sorted(names))+"\n")
          print("XREF_OWNERS",len(owners))
          print((root/"functions"/"xref-owners.tsv").read_text())
          PY
          set +e
          while IFS=$'\t' read -r addr reasons; do
            [ -n "$addr" ] || continue
            safe="$(printf '%s' "$addr" | tr -cd '[:alnum:]x')"
            timeout --signal=TERM --kill-after=20s 300 "$AOTOPSY_BIN" _debug decompile-native --lib "$SOC_LIBAPP" --func "$addr" > "$RUNNER_TEMP/out/functions/$safe.stdout" 2> "$RUNNER_TEMP/out/logs/decompile-$safe.stderr"
            rc=$?
            echo "$rc" > "$RUNNER_TEMP/out/logs/decompile-$safe.exit"
            echo "decompile $addr ($reasons) exit=$rc"
          done < "$RUNNER_TEMP/out/functions/xref-owners.tsv"
          set -e

      - name: Build xref-led storage and calculation dossier
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,re,json
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"out"
          report=["# SOC xref-led decompilation dossier","","## Xref owner addresses"]
          p=root/"functions/xref-owners.tsv"
          if p.exists(): report.append(p.read_text())
          report += ["","## String evidence"]
          for p in sorted((root/"strings").glob("*.stdout")):
            s=p.read_text(errors="replace")
            if s.strip():
              report += [f"### {p.stem}",s[:6500]]
          report += ["","## Decompiled xref-owner functions"]
          for p in sorted((root/"functions").glob("0x*.stdout")):
            s=p.read_text(errors="replace")
            err=(root/"logs"/("decompile-"+p.stem+".stderr")).read_text(errors="replace") if (root/"logs"/("decompile-"+p.stem+".stderr")).exists() else ""
            report += [f"### {p.stem}: {len(s.encode())} bytes, {s.count(chr(10))+1} lines",s[:13000]]
            if len(s)>13000: report.append("Full function output retained in artifact.")
            if err.strip(): report += ["stats:",err[:3000]]
          (root/"xref-led-decompilation.md").write_text("\n".join(report)+"\n")
          print((root/"xref-led-decompilation.md").read_text()[:90000])
          PY
          cat "$RUNNER_TEMP/out/xref-led-decompilation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload xref-led function decompilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-soc-xref-led-decompilation-20261123
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
